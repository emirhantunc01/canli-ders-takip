plugins { id 'com.android.application' }
android {
 namespace 'com.emirhantunc.dersdefteri'
 compileSdk 34
 defaultConfig {
  applicationId 'com.emirhantunc.dersdefteri'
  minSdk 26
  targetSdk 34
  versionCode 1
  versionName '1.3.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 def signingProperties = new Properties()
 def signingFile = rootProject.file('../.local/android-signing.properties')
 if(signingFile.exists()) {
  signingProperties.load(new FileInputStream(signingFile))
  signingConfigs { personal { storeFile rootProject.file('../.local/ders-defteri.jks'); storePassword signingProperties['storePassword']; keyAlias 'ders-defteri'; keyPassword signingProperties['storePassword'] } }
 }
 buildTypes {
  release {
   minifyEnabled false
   if(signingFile.exists()) signingConfig signingConfigs.personal
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildFeatures { buildConfig true }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.10.0'
 androidTestImplementation 'androidx.test:runner:1.5.2'
 androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}

dependencies { testImplementation 'junit:junit:4.13.2' }
